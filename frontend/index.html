<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="192x192" href="./pwa-icon-192.png" />
  <link rel="apple-touch-icon" href="./pwa-icon-192.png" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#2196F3" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Khaliya Restaurant</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- GSAP for Animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>

<body>
  <div id="root"></div>

  <!-- PWA Install Banner -->
  <div id="pwaInstallBanner" class="pwa-install-banner">
    <div style="display: flex; align-items: center; gap: 12px; flex: 1;">
      <img src="./pwa-icon-192.png" alt="App Icon" class="pwa-banner-icon"
        style="width: 40px; height: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.15);">
      <div class="pwa-banner-text" style="flex: 1; text-align: left;">
        <h4 style="margin: 0; font-size: 1rem; color: #333;">Khaliya App</h4>
      </div>
    </div>
    <div class="pwa-banner-actions" style="display: flex; gap: 12px; align-items: center; flex-direction: row;">
      <button onclick="document.getElementById('pwaInstallBanner').classList.remove('active')" class="btn-text"
        style="background: transparent; border: none; cursor: pointer; color: #555; font-size: 0.9rem; padding: 0;">Close</button>
      <button onclick="window.promptInstall()" class="btn"
        style="border-radius: 6px; padding: 8px 16px; background: #E63946; color: white; border: none; cursor: pointer; font-weight: bold; font-size: 0.9rem; margin-top: 0;">Install</button>
    </div>
  </div>

  <script type="module" src="./src/main.jsx"></script>
  <script type="module" src="/pwa-manager.js"></script>
  <script>
    // CACHE BUSTER: Force clear service worker and cache to ensure new CSS loads
    (function () {
      if (!localStorage.getItem('cache_busted_v1')) {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            for (let registration of registrations) {
              registration.unregister();
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function (names) {
            for (let name of names) caches.delete(name);
          });
        }
        localStorage.setItem('cache_busted_v1', 'true');
        setTimeout(() => window.location.reload(true), 500);
      }
    })();
  </script>
</body>

</html>
