<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="192x192" href="./pwa-icon-192.png" />
  <link rel="apple-touch-icon" href="./pwa-icon-192.png" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#2196F3" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Khaliya Restaurant</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- GSAP for Animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>

<body>
  <div id="root"></div>

  <script type="module" src="./src/main.jsx"></script>
  <script type="module" src="/pwa-manager.js?v=2.6"></script>
  <script>
    // CACHE BUSTER: Force clear service worker and cache to ensure new CSS loads
    (function () {
        if (!localStorage.getItem('cache_busted_v3')) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              for (let registration of registrations) {
                registration.unregister();
              }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function (names) {
              for (let name of names) caches.delete(name);
            });
          }
          localStorage.setItem('cache_busted_v3', 'true');
          setTimeout(() => window.location.reload(true), 1200);
        }
    })();
  </script>

  <!-- PWA Install Banner -->
  <div id="pwaInstallBanner" class="pwa-banner">
    <div class="pwa-banner-inner">
      <div class="pwa-icon">
        <img src="./pwa-icon-192.png" alt="Khaliya Logo">
      </div>
      <div class="pwa-content">
        <h3 id="pwaInstallTitle">Install Khaliya App</h3>
        <p id="pwaInstallDesc">Fast access to our menu and live order updates.</p>
      </div>
      <div class="pwa-actions">
        <button id="pwaInstallBtn" class="pwa-btn-install" onclick="window.promptInstall()">Install</button>
        <button id="pwaLaterBtn" class="pwa-btn-later">Later</button>
      </div>
    </div>
  </div>
</body>

</html>
