<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="192x192" href="./pwa-icon-192.png" />
  <link rel="apple-touch-icon" href="./pwa-icon-192.png" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#2196F3" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Khaliya Restaurant</title>
  
  <script>
    // 1. ADVANCED DIAGNOSTIC GUARD: Catch EVERYTHING
    (function() {
      function showDiag(msg, detail) {
        var div = document.createElement('div');
        div.style = "position:fixed;top:0;left:0;width:100%;background:#8E1C1C;color:#fff;padding:25px;z-index:99999;font-family:sans-serif;font-weight:bold;box-sizing:border-box;border-bottom:5px solid #DAA520";
        div.innerHTML = "<div style='font-size:18px;margin-bottom:10px'>⚠ CRITICAL STARTUP FAILURE</div>" + 
                        "<div style='font-size:12px;opacity:0.9;font-family:monospace'>" + msg + "</div>" +
                        (detail ? "<div style='font-size:10px;margin-top:10px;opacity:0.7'>" + detail + "</div>" : "");
        document.body ? document.body.appendChild(div) : document.documentElement.appendChild(div);
      }

      // Capture runtime errors
      window.onerror = function(m, u, l) { showDiag("JS Error: " + m, u + ":" + l); return false; };
      
      // Capture resource (404) errors
      window.addEventListener('error', function(e) {
        if (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK') {
          showDiag("Resource Loading Error", e.target.src || e.target.href);
        }
      }, true);

      // 2. WATCHDOG: If #root is empty after 5 seconds, show "App Hung"
      window.addEventListener('load', function() {
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && root.innerHTML === "") {
            showDiag("Application Hang detected", "The app failed to render the main interface. This usually means a dependency failed to initialize or a router error occurred.");
          }
        }, 5000);
      });

      // 3. NUCLEAR RESET: Clear ALL service workers and caches twice
      if (!localStorage.getItem('nuclear_reset_v9')) {
        console.log('☢ Final PWA Hardening Reset (v9) in progress...');
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(rs) {
            for(let r of rs) r.unregister();
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(ns) {
            for(let n of ns) caches.delete(n);
          });
        }
        localStorage.setItem('nuclear_reset_v9', 'true');
        setTimeout(function() { window.location.reload(true); }, 2000);
      }
    })();
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- GSAP for Animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>

<body>
  <div id="root"></div>

  <script type="module" src="./src/main.jsx"></script>
  <script type="module" src="/pwa-manager.js"></script>

  <!-- PWA Install Banner -->
  <div id="pwaInstallBanner" class="pwa-banner">
    <div class="pwa-banner-inner">
      <div class="pwa-icon">
        <img src="./pwa-icon-192.png" alt="Khaliya Logo">
      </div>
      <div class="pwa-content">
        <h3 id="pwaInstallTitle">Install Khaliya App</h3>
        <p id="pwaInstallDesc">Fast access to our menu and live order updates.</p>
      </div>
      <div class="pwa-actions">
        <button id="pwaInstallBtn" class="pwa-btn-install" onclick="window.promptInstall()">Install</button>
        <button id="pwaLaterBtn" class="pwa-btn-later">Later</button>
      </div>
    </div>
  </div>
</body>

</html>
