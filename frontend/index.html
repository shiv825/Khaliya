<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="192x192" href="./pwa-icon-192.png" />
  <link rel="apple-touch-icon" href="./pwa-icon-192.png" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#2196F3" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Khaliya Restaurant</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- GSAP for Animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>

<body>
  <div id="root"></div>

  <!-- PWA Install Banner -->
  <div id="pwaInstallBanner" class="pwa-install-banner">
    <img src="./pwa-icon-192.png" alt="App Icon" class="pwa-banner-icon"
      style="width: 80px; height: 80px; border-radius: 16px; box-shadow: 0 8px 16px rgba(0,0,0,0.15);">
    <div class="pwa-banner-text">
      <h4>Install Khaliya App</h4>
      <p style="margin-bottom:1.5rem;">Get the full app experience on your device.</p>
    </div>
    <div class="pwa-banner-actions">
      <button onclick="window.promptInstall()" class="btn"
        style="width: 100%; border-radius: 12px; padding: 12px; background: #E63946; color: white; border: none; cursor: pointer; font-weight: bold;">📥
        Install App</button>
      <button onclick="document.getElementById('pwaInstallBanner').classList.remove('active')" class="btn-text"
        style="width: 100%; margin-top: 8px; background: transparent; border: none; cursor: pointer; color: #555;">Maybe
        Later</button>
    </div>
  </div>

  <script type="module" src="./src/main.jsx"></script>
  <script type="module" src="./pwa-manager.js"></script>
</body>

</html>
